<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG to FB Auto Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex items-center justify-center">
  <div class="text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-sky-500/20 mb-4">📣</div>
    <p class="text-sm text-slate-400">Redirecting…</p>
  </div>
<script>
  (async () => {
    try {
      const res = await fetch('/api/me');
      window.location.href = res.ok ? '/dashboard' : '/login';
    } catch (_) {
      window.location.href = '/login';
    }
  })();
</script>
</body>
</html>
