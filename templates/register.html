<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - TG to FB Auto Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'Tajawal', 'system-ui', 'sans-serif'] } } } };
</script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
  <div class="mb-8 text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-sky-500/20 mb-3">📣</div>
    <h1 id="page-title" class="text-xl font-bold text-white">Create account</h1>
    <p id="page-sub" class="text-xs text-slate-400 mt-1">Each account has its own isolated workspace.</p>
  </div>

  <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
    <form id="auth-form" class="space-y-4">
      <div>
        <label id="lbl-email" class="block text-xs font-medium text-slate-400 mb-1.5">Email</label>
        <input id="inp-email" type="email" autocomplete="email" required
          class="w-full px-3 py-2.5 rounded-lg bg-slate-800/70 border border-slate-700 focus:border-sky-500 focus:outline-none text-sm transition">
      </div>
      <div>
        <label id="lbl-pass" class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
        <input id="inp-pass" type="password" autocomplete="new-password" minlength="6" required
          class="w-full px-3 py-2.5 rounded-lg bg-slate-800/70 border border-slate-700 focus:border-sky-500 focus:outline-none text-sm transition">
      </div>
      <button id="btn-submit" type="submit"
        class="w-full py-2.5 rounded-xl bg-gradient-to-r rtl:bg-gradient-to-l from-sky-500 to-indigo-600 text-white text-sm font-semibold hover:from-sky-400 hover:to-indigo-500 active:scale-95 transition shadow-lg shadow-sky-500/20">
        Create account
      </button>
    </form>
    <p id="form-msg" class="hidden mt-3 text-xs rounded-lg px-3 py-2"></p>
    <p id="link-line" class="mt-4 text-center text-xs text-slate-400">
      Already have an account? <a id="link-alt" href="/login" class="text-sky-400 hover:text-sky-300 font-semibold">Sign in</a>
    </p>
  </div>

  <div class="mt-6 text-center">
    <button id="btn-lang" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-700 bg-slate-800/60 hover:bg-slate-700/60 transition">🌐 العربية</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let lang = localStorage.getItem('tgfb_lang') === 'ar' ? 'ar' : 'en';

  const I18N = {
    en: {
      title: 'Create account', sub: 'Each account has its own isolated workspace.',
      email: 'Email', pass: 'Password', btn: 'Create account',
      hasAccount: 'Already have an account?', signin: 'Sign in',
      invalid: 'Enter a valid email address.',
      short: 'Password must be at least 6 characters.',
      exists: 'An account with this email already exists.',
      other: 'Could not create the account.',
    },
    ar: {
      title: 'إنشاء حساب', sub: 'لكل حساب مساحة عمل معزولة خاصة به.',
      email: 'البريد الإلكتروني', pass: 'كلمة المرور', btn: 'إنشاء حساب',
      hasAccount: 'لديك حساب بالفعل؟', signin: 'تسجيل الدخول',
      invalid: 'أدخل بريدًا إلكترونيًا صالحًا.',
      short: 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.',
      exists: 'يوجد حساب بهذا البريد بالفعل.',
      other: 'تعذّر إنشاء الحساب.',
    },
  };

  function t(k) { return I18N[lang][k] || I18N.en[k]; }

  function applyLang() {
    const ar = lang === 'ar';
    document.documentElement.lang = ar ? 'ar' : 'en';
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.body.style.fontFamily = ar
      ? "'Tajawal','Inter','Segoe UI',system-ui,sans-serif"
      : "'Inter','Tajawal','system-ui',sans-serif";
    $('page-title').textContent = t('title');
    $('page-sub').textContent = t('sub');
    $('lbl-email').textContent = t('email');
    $('lbl-pass').textContent = t('pass');
    $('btn-submit').textContent = t('btn');
    $('btn-lang').textContent = '🌐 ' + (ar ? 'English' : 'العربية');
    const alt = $('link-alt');
    $('link-line').innerHTML = t('hasAccount') + ' <a id="link-alt" href="' + alt.href + '" class="text-sky-400 hover:text-sky-300 font-semibold">' + t('signin') + '</a>';
  }

  function showMsg(text, ok) {
    const el = $('form-msg');
    el.textContent = text;
    el.classList.remove('hidden');
    el.className = 'mt-3 text-xs rounded-lg px-3 py-2 ' + (ok
      ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-700/50'
      : 'bg-rose-500/10 text-rose-300 border border-rose-700/50');
  }

  $('btn-lang').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('tgfb_lang', lang);
    applyLang();
  });

  $('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('btn-submit');
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('inp-email').value.trim(), password: $('inp-pass').value }),
      });
      const data = await res.json();
      if (res.ok) { window.location.href = '/dashboard'; return; }
      if (res.status === 409) showMsg(t('exists'), false);
      else showMsg(data.message || t('other'), false);
    } catch (err) {
      showMsg(t('other'), false);
    } finally {
      btn.disabled = false;
      applyLang();
    }
  });

  applyLang();
})();
</script>
</body>
</html>
