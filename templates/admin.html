<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - TG to FB Auto Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen">

<header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-lg shrink-0">👑</div>
      <div>
        <h1 data-i18n="title" class="text-base font-bold text-white leading-none">Admin Panel</h1>
        <p data-i18n="sub" class="text-xs text-slate-400 mt-1">Manage tenant accounts and workspaces.</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-lang" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-700 bg-slate-800/60 hover:bg-slate-700/60 transition">🌐 العربية</button>
      <a href="/dashboard" data-i18n="back" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-700 bg-slate-800/60 hover:bg-slate-700/60 transition">← Dashboard</a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
  <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 data-i18n="usersTitle" class="text-sm font-bold text-white">👥 Users</h2>
      <span id="users-count" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left rtl:text-right text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-800">
            <th class="py-2 pr-3" data-i18n="colId">ID</th>
            <th class="py-2 pr-3" data-i18n="colEmail">Email</th>
            <th class="py-2 pr-3" data-i18n="colRole">Role</th>
            <th class="py-2 pr-3" data-i18n="colStatus">Status</th>
            <th class="py-2 pr-3" data-i18n="colCreated">Created</th>
            <th class="py-2" data-i18n="colActions">Actions</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
    <p id="users-error" class="hidden mt-3 text-xs text-rose-300"></p>
  </div>
</main>

<div id="toast" class="fixed bottom-5 start-5 max-w-sm px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 shadow-2xl text-sm hidden"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let lang = localStorage.getItem('tgfb_lang') === 'ar' ? 'ar' : 'en';
  const toastTimer = {};

  const I18N = {
    en: {
      title: 'Admin Panel', sub: 'Manage tenant accounts and workspaces.',
      back: '← Dashboard', usersTitle: '👥 Users', colId: 'ID', colEmail: 'Email',
      colRole: 'Role', colStatus: 'Status', colCreated: 'Created', colActions: 'Actions',
      active: 'active', disabled: 'disabled', admin: 'admin', user: 'user',
      promote: '👑 Make admin', demote: '↩️ Make user', enable: '✅ Enable', disable: '🚫 Disable',
      saved: 'Saved', err: 'Failed to load users.', updateErr: 'Update failed.',
    },
    ar: {
      title: 'لوحة الإدارة', sub: 'إدارة حسابات المستخدمين ومساحات العمل.',
      back: '→ لوحة التحكم', usersTitle: '👥 المستخدمون', colId: 'المعرف', colEmail: 'البريد',
      colRole: 'الدور', colStatus: 'الحالة', colCreated: 'تاريخ الإنشاء', colActions: 'إجراءات',
      active: 'مفعّل', disabled: 'معطّل', admin: 'مدير', user: 'مستخدم',
      promote: '👑 جعل مديرًا', demote: '↩️ جعل مستخدمًا', enable: '✅ تفعيل', disable: '🚫 تعطيل',
      saved: 'تم الحفظ', err: 'تعذّر تحميل المستخدمين.', updateErr: 'فشل التحديث.',
    },
  };

  function t(k) { return I18N[lang][k] || I18N.en[k]; }
  function applyLang() {
    const ar = lang === 'ar';
    document.documentElement.lang = ar ? 'ar' : 'en';
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.body.style.fontFamily = ar
      ? "'Tajawal','Inter','Segoe UI',system-ui,sans-serif"
      : "'Inter','Tajawal','system-ui',sans-serif";
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $('btn-lang').textContent = '🌐 ' + (ar ? 'English' : 'العربية');
    applyRows();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let users = [];
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function toast(msg, ok) {
    const el = $('toast');
    el.textContent = (ok ? '✅ ' : '❌ ') + msg;
    el.className = 'fixed bottom-5 start-5 max-w-sm px-4 py-3 rounded-xl shadow-2xl text-sm ' + (ok
      ? 'bg-emerald-900/90 border border-emerald-700 text-emerald-100'
      : 'bg-rose-900/90 border border-rose-700 text-rose-100');
    el.classList.remove('hidden');
    clearTimeout(toastTimer.id);
    toastTimer.id = setTimeout(() => el.classList.add('hidden'), 3000);
  }

  function applyRows() {
    const body = $('users-body');
    body.innerHTML = '';
    users.forEach((u) => {
      const tr = document.createElement('tr');
      tr.className = 'border-b border-slate-800/70 last:border-0';
      const roleCls = u.role === 'admin' ? 'text-sky-300' : 'text-slate-300';
      const statusCls = u.active ? 'text-emerald-300' : 'text-rose-300';
      tr.innerHTML = `
        <td class="py-3 pr-3 font-mono text-xs text-slate-400">${u.id}</td>
        <td class="py-3 pr-3 font-medium">${esc(u.email)}</td>
        <td class="py-3 pr-3 ${roleCls}">${t(u.role)}</td>
        <td class="py-3 pr-3 ${statusCls}">${u.active ? t('active') : t('disabled')}</td>
        <td class="py-3 pr-3 text-xs text-slate-500">${fmtDate(u.created_at)}</td>
        <td class="py-3">
          <div class="flex flex-wrap gap-1.5" data-uid="${u.id}">
            ${u.role === 'admin'
              ? `<button data-act="demote" class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-[11px] font-semibold hover:bg-slate-700 transition">${t('demote')}</button>`
              : `<button data-act="promote" class="px-2.5 py-1 rounded-lg bg-sky-500/15 text-sky-300 border border-sky-700/40 text-[11px] font-semibold hover:bg-sky-500/25 transition">${t('promote')}</button>`}
            ${u.active
              ? `<button data-act="disable" class="px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300 border border-rose-700/40 text-[11px] font-semibold hover:bg-rose-500/25 transition">${t('disable')}</button>`
              : `<button data-act="enable" class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 border border-emerald-700/40 text-[11px] font-semibold hover:bg-emerald-500/25 transition">${t('enable')}</button>`}
          </div>
        </td>`;
      body.appendChild(tr);
    });
    $('users-count').textContent = users.length;
  }

  async function load() {
    try {
      const res = await fetch('/api/admin/users');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      users = data.users || [];
      applyRows();
    } catch (err) {
      const el = $('users-error');
      el.classList.remove('hidden');
      el.textContent = t('err');
    }
  }

  $('users-body').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const uid = btn.closest('[data-uid]').dataset.uid;
    const act = btn.dataset.act;
    const patch = act === 'promote' ? { role: 'admin' }
      : act === 'demote' ? { role: 'user' }
      : act === 'enable' ? { active: true }
      : { active: false };
    try {
      const res = await fetch('/api/admin/users/' + uid, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'HTTP ' + res.status);
      users = users.map((u) => (u.id === data.user.id ? data.user : u));
      toast(t('saved'), true);
      applyRows();
    } catch (err) {
      toast(err.message || t('updateErr'), false);
    }
  });

  $('btn-lang').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('tgfb_lang', lang);
    applyLang();
  });

  applyLang();
  load();
})();
</script>
</body>
</html>
